name: Build Kartik Kamboj Music APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kartik-kamboj-music-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/Kartik-Kamboj-Music-Video-Edition.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f \
              -iname 'Kartik-Kamboj-Music-Video-Edition.zip' \
              ! -path '*/_kk_build/*' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Music ZIP not found. Upload the correct ZIP."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/_kk_build"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/_kk_build"

          GRADLEW="$(find "$GITHUB_WORKSPACE/_kk_build" \
            -type f -name gradlew \
            ! -path '*/.gradle/*' | head -n 1 || true)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd)"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Build universal APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew

          ./gradlew :app:assembleUniversalFossDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          if ! find "$GITHUB_WORKSPACE/apk-output" \
            -type f -name '*.apk' | grep -q .; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kartik-Kamboj-Music-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Save error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kartik-Kamboj-Build-Error-Log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore
          retention-days: 7
