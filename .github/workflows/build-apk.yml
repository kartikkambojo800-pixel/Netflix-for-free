name: Build Kartik Kamboj Music APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kartik-kamboj-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 4 -type f \
            -iname 'Kartik-Kamboj-Music-Video-Edition.zip' \
            -not -path './_kk_build/*' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "::error::Source ZIP not found."
            echo "Upload Kartik-Kamboj-Music-Video-Edition.zip to the repository."
            exit 1
          fi

          echo "Using source: $ZIP"

          mkdir -p _kk_build
          unzip -q "$ZIP" -d _kk_build

          GRADLEW="$(find _kk_build -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Check Gradle project and build task
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          ./gradlew --version

          ./gradlew tasks --all --no-daemon \
            | tee "$RUNNER_TEMP/gradle-tasks.txt"

          if grep -q 'assembleUniversalFossDebug' \
            "$RUNNER_TEMP/gradle-tasks.txt"; then
            echo "BUILD_TASK=assembleUniversalFossDebug" >> "$GITHUB_ENV"
          elif grep -q 'assembleFossDebug' \
            "$RUNNER_TEMP/gradle-tasks.txt"; then
            echo "BUILD_TASK=assembleFossDebug" >> "$GITHUB_ENV"
          else
            echo "::error::Expected debug APK task not found."
            echo "Check the Gradle task list above."
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          echo "Building task: $BUILD_TASK"

          ./gradlew "$BUILD_TASK" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: Collect APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-output

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' \
            -exec cp {} apk-output/ \;

          if ! find apk-output -maxdepth 1 \
            -type f -name '*.apk' | grep -q .; then
            echo "::error::Build completed but no APK was found."
            exit 1
          fi

          ls -lh apk-output/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kartik-Kamboj-Music-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kartik-Kamboj-Build-Error-Log
          path: |
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/gradle-tasks.txt
          if-no-files-found: ignore
          retention-days: 7
