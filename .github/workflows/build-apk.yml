name: Build Kartik Kamboj Music APK (from ZIP)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and extract the source ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -iname "Kartik-Kamboj-Music-source-SaffronNoir.zip" -not -path "./_kk_build/*" | head -1)
          if [ -z "$ZIP" ]; then echo "ERROR: zip nahi mili"; exit 1; fi
          mkdir -p _kk_build
          unzip -q "$ZIP" -d _kk_build
          GRADLEW=$(find _kk_build -maxdepth 3 -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then echo "ERROR: gradlew nahi mila"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000
      - name: Build universal debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kartik-Kamboj-Music-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
