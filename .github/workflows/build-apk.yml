
name: Build OpenStream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Repository files:"
          ls -la
          echo "Searching for Gradle wrapper..."
          WRAPPER="$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew file not found."
            echo "Upload the extracted Android source code, not just the workflow."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenStream-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
