
name: Build Kartik Kamboj Music APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kartik-kamboj-music-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 -type f -iname '*.zip' \
            ! -path '*/_kk_build/*' \
            ! -path '*/.git/*' \
            | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "::error::No source ZIP found in repository."
            exit 1
          fi

          echo "Selected ZIP: $ZIP"

          mkdir -p "$GITHUB_WORKSPACE/_kk_build"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/_kk_build"

          GRADLEW="$(find "$GITHUB_WORKSPACE/_kk_build" \
            -type f -name gradlew \
            ! -path '*/.gradle/*' \
            | head -n 1 || true)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::No Gradle wrapper found in ZIP."
            echo "This ZIP may not contain an Android source project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager is missing."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Find Android build task
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

          ./gradlew --version

          ./gradlew tasks --all \
            --no-daemon \
            --console=plain \
            | tee "$RUNNER_TEMP/gradle-tasks.txt"

          if grep -qE '^[[:space:]]*assembleUniversalFossDebug([[:space:]]|$)' \
            "$RUNNER_TEMP/gradle-tasks.txt"; then
            TASK="assembleUniversalFossDebug"
          elif grep -qE '^[[:space:]]*assembleFossDebug([[:space:]]|$)' \
            "$RUNNER_TEMP/gradle-tasks.txt"; then
            TASK="assembleFossDebug"
          elif grep -qE '^[[:space:]]*assembleDebug([[:space:]]|$)' \
            "$RUNNER_TEMP/gradle-tasks.txt"; then
            TASK="assembleDebug"
          else
            echo "::error::No supported debug APK task found."
            grep -E 'assemble.*Debug' \
              "$RUNNER_TEMP/gradle-tasks.txt" || true
            exit 1
          fi

          echo "BUILD_TASK=$TASK" >> "$GITHUB_ENV"
          echo "Selected build task: $TASK"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          ./gradlew "$BUILD_TASK" \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: Collect APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$PROJECT_DIR" \
            -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -exec cp -n {} "$GITHUB_WORKSPACE/apk-output/" \;

          if ! find "$GITHUB_WORKSPACE/apk-output" \
            -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::No APK was generated."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/apk-output/"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kartik-Kamboj-Music-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kartik-Kamboj-Build-Diagnostics
          path: |
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/gradle-tasks.txt
          if-no-files-found: ignore
          retention-days: 7
