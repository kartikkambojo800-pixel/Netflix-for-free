name: Build Kartik Kamboj Nocturne Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Universal Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract NocturneRedesign ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -name 'Kartik-Kamboj-Music-source-NocturneRedesign.zip' \
            -not -path './_kk_build/*' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "::error::NocturneRedesign ZIP was not found."
            echo "Upload Kartik-Kamboj-Music-source-NocturneRedesign.zip to the repository root."
            exit 1
          fi

          mkdir -p _kk_build
          unzip -oq "$ZIP_FILE" -d _kk_build

          GRADLEW="$(find _kk_build -type f -name gradlew -print -quit)"

          if [[ -z "$GRADLEW" ]]; then
            echo "::error::gradlew was not found inside the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo "::error::settings.gradle.kts was not found."
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::Android app module was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses and install requirements
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android SDK manager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-37" \
            "ndk;28.2.13676358"

      - name: Prepare debug signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -validity 10000
          fi

      - name: Build universal FOSS debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleUniversalFossDebug

      - name: Verify APK output
        shell: bash
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk"
          find "$APK_DIR" -type f -name '*.apk' -print

          if ! find "$APK_DIR" -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::Build completed without an APK file."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kartik-Kamboj-Nocturne-Universal-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
