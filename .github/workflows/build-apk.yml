
name: Build OpenStream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source ZIP
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'OpenStream-main.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: OpenStream-main.zip not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted
          WRAPPER="$(find extracted -type f -name gradlew | head -n 1)"
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: ZIP does not contain gradlew"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenStream-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
