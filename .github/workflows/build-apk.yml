name: Build Kartik Kamboj Music APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Kartik-Kamboj-Music-source-NocturneRedesign.zip"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Kartik-Kamboj-Music-source-NocturneRedesign.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::ZIP not found: $ZIP_FILE"
            echo "Files available in repository:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/_kk_build"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_kk_build"

          echo "Extracted project files:"
          find "$GITHUB_WORKSPACE/_kk_build" \
            -maxdepth 4 \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \) -print

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/_kk_build"

          GRADLEW="$(find "$ROOT" -type f -name gradlew -print -quit)"

          if [[ -z "$GRADLEW" ]]; then
            echo "::error::gradlew not found in the ZIP"
            find "$ROOT" -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

          if [[ -f "$PROJECT_DIR/local.properties" ]]; then
            rm -f "$PROJECT_DIR/local.properties"
          fi

      - name: Install Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Create debug signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show Gradle tasks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon tasks --all

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleUniversalFossDebug

      - name: Find generated APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$PROJECT_DIR" -type f -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          if ! find "$GITHUB_WORKSPACE/apk-output" \
            -type f -name "*.apk" -print -quit | grep -q .; then
            echo "::error::No APK was generated"
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kartik-Kamboj-Music-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
